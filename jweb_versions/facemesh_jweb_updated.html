<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FaceMesh Hybrid Output (Green Landmarks, Depth-Scaled)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; }
    video, canvas { position: absolute; top: 0; left: 0; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 250px;
      border-radius: 6px;
    }
    #fps { font-weight: bold; }
    #cameraStatus {
      display: block;
      margin-top: 4px;
      max-width: 230px;
      font-size: 11px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

<div id="controls">
  <label>
    Camera:
    <select id="cameraSelect" disabled>
      <option value="">Loading cameras...</option>
    </select>
  </label><br>
  <label><input type="checkbox" id="showVideo"> Show Video</label><br>
  <label><input type="checkbox" id="showOverlay" checked> Show Overlay</label><br>
  <label><input type="checkbox" id="sendOutput" checked> Send Output</label><br>
  <label><input type="checkbox" id="reducedOutput"> Reduced Landmark Set</label><br>
  <label><input type="checkbox" id="flatList"> Flat List (vs XYZ lists)</label><br>
  <span id="fps">FPS: --</span>
  <span id="cameraStatus">Camera: initialising...</span>
</div>

<video id="inputVideo" autoplay muted playsinline></video>
<canvas id="videoCanvas"></canvas>

<script>
const ws = (window.max) ? null : new WebSocket('ws://localhost:8084');
const videoElement = document.getElementById('inputVideo');
const canvasElement = document.getElementById('videoCanvas');
const canvasCtx = canvasElement.getContext('2d');
const fpsDisplay = document.getElementById('fps');
const cameraSelect = document.getElementById('cameraSelect');
const cameraStatus = document.getElementById('cameraStatus');
const check = (id) => document.getElementById(id).checked;
let lastTime = performance.now();
let frameCount = 0;

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({ refineLandmarks: true, maxNumFaces: 1 });
faceMesh.onResults(onResults);

let activeStream = null;
let activeDeviceId = null;
let cameraGeneration = 0;
let faceMeshIsProcessing = false;

const sleep = (milliseconds) =>
  new Promise(resolve => setTimeout(resolve, milliseconds));

async function initialiseCameras() {
  if (!navigator.mediaDevices?.getUserMedia) {
    handleCameraError(
      new Error('getUserMedia is unavailable'),
      'Camera API unavailable'
    );
    return;
  }

  cameraSelect.disabled = true;

  try {
    // Ask for permission first so Chromium/jweb can expose camera labels.
    const permissionStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    permissionStream.getTracks().forEach(track => track.stop());
    await sleep(100);

    await refreshCameraList();

    if (cameraSelect.value) {
      await startCamera(cameraSelect.value);
    }

    navigator.mediaDevices.addEventListener?.(
      'devicechange',
      handleDeviceChange
    );
  } catch (error) {
    handleCameraError(error, 'Could not initialise cameras');
  } finally {
    cameraSelect.disabled = !cameraSelect.value;
  }
}

async function getVideoInputs() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter(device => device.kind === 'videoinput');
}

async function refreshCameraList() {
  const previousSelection = activeDeviceId || cameraSelect.value;
  const videoInputs = await getVideoInputs();

  cameraSelect.innerHTML = '';

  if (!videoInputs.length) {
    const option = document.createElement('option');
    option.value = '';
    option.textContent = 'No cameras found';
    cameraSelect.appendChild(option);
    cameraSelect.disabled = true;
    cameraStatus.textContent = 'Camera: none found';
    return videoInputs;
  }

  videoInputs.forEach((device, index) => {
    const option = document.createElement('option');
    option.value = device.deviceId;
    option.textContent = device.label || `Camera ${index + 1}`;
    cameraSelect.appendChild(option);
  });

  const previousStillExists = videoInputs.some(
    device => device.deviceId === previousSelection
  );

  cameraSelect.value = previousStillExists
    ? previousSelection
    : videoInputs[0].deviceId;

  return videoInputs;
}

async function handleDeviceChange() {
  try {
    const oldActiveDeviceId = activeDeviceId;
    const videoInputs = await refreshCameraList();
    const activeCameraStillExists = videoInputs.some(
      device => device.deviceId === oldActiveDeviceId
    );

    if (!activeCameraStillExists) {
      if (cameraSelect.value) {
        await startCamera(cameraSelect.value);
      } else {
        ++cameraGeneration;
        stopActiveCamera();
        videoElement.srcObject = null;
      }
    }
  } catch (error) {
    handleCameraError(error, 'Could not refresh cameras');
  }
}

cameraSelect.addEventListener('change', async () => {
  if (cameraSelect.value) {
    await startCamera(cameraSelect.value);
  }
});

async function startCamera(deviceId) {
  if (!deviceId) return;

  // Invalidates the processing loop belonging to the previous camera.
  const generation = ++cameraGeneration;
  cameraSelect.disabled = true;
  cameraStatus.textContent = 'Camera: switching...';

  // Fully release the previous device before requesting the selected one.
  stopActiveCamera();
  videoElement.pause();
  videoElement.srcObject = null;
  await sleep(100);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        deviceId: { exact: deviceId },
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    // A newer selection may have completed while this request was pending.
    if (generation !== cameraGeneration) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    activeStream = stream;
    activeDeviceId = deviceId;
    videoElement.srcObject = stream;

    await waitForVideoMetadata();
    await videoElement.play();

    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings();
    const label = track.label ||
      cameraSelect.options[cameraSelect.selectedIndex]?.text ||
      'Unknown camera';

    cameraStatus.textContent = `Camera: ${label}`;
    console.log('Active camera:', {
      label,
      requestedDeviceId: deviceId,
      actualDeviceId: settings.deviceId,
      width: settings.width,
      height: settings.height,
      frameRate: settings.frameRate
    });

    processCameraFrames(generation);
  } catch (error) {
    if (generation === cameraGeneration) {
      stopActiveCamera();
      videoElement.srcObject = null;
    }
    handleCameraError(error, 'Could not start selected camera');
  } finally {
    cameraSelect.disabled = !cameraSelect.value;
  }
}

function stopActiveCamera() {
  if (!activeStream) return;
  activeStream.getTracks().forEach(track => track.stop());
  activeStream = null;
  activeDeviceId = null;
}

function waitForVideoMetadata() {
  if (videoElement.readyState >= HTMLMediaElement.HAVE_METADATA) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Timed out waiting for video metadata'));
    }, 5000);

    function cleanup() {
      clearTimeout(timeout);
      videoElement.removeEventListener('loadedmetadata', loaded);
      videoElement.removeEventListener('error', failed);
    }

    function loaded() {
      cleanup();
      resolve();
    }

    function failed() {
      cleanup();
      reject(new Error('Video element failed to load the camera stream'));
    }

    videoElement.addEventListener('loadedmetadata', loaded);
    videoElement.addEventListener('error', failed);
  });
}

async function processCameraFrames(generation) {
  if (
    generation !== cameraGeneration ||
    !activeStream ||
    !activeStream.active
  ) {
    return;
  }

  const track = activeStream.getVideoTracks()[0];
  if (!track || track.readyState !== 'live') return;

  if (
    videoElement.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
    !faceMeshIsProcessing
  ) {
    faceMeshIsProcessing = true;

    try {
      await faceMesh.send({ image: videoElement });
    } catch (error) {
      console.error('FaceMesh processing error:', error);
    } finally {
      faceMeshIsProcessing = false;
    }
  }

  requestAnimationFrame(() => processCameraFrames(generation));
}

function handleCameraError(error, context) {
  const detail = error?.name || error?.message || 'Unknown error';
  cameraStatus.textContent = `${context}: ${detail}`;
  console.error(context, error);
}

function sendToMax(address, ...args) {
  if (window.max && typeof window.max.outlet === 'function') {
    window.max.outlet(address, ...args);
  } else if (ws && ws.readyState === WebSocket.OPEN && check('sendOutput')) {
    ws.send(JSON.stringify({ address, args }));
  }
}

function onResults(results) {
  canvasElement.width = videoElement.videoWidth;
  canvasElement.height = videoElement.videoHeight;
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  if (!results.multiFaceLandmarks?.[0]) return;
  let landmarks = results.multiFaceLandmarks[0];

  if (check('reducedOutput')) {
    const reducedIndices = [10, 33, 133, 362, 263, 61, 291, 199, 1];
    landmarks = reducedIndices.map(i => landmarks[i]);
  }

  if (check('showOverlay')) {
    drawOverlay(landmarks);
  }

  if (check('sendOutput')) {
    if (check('flatList')) {
      sendToMax("/facemesh/flat", ...landmarks.flatMap(p => [p.x, p.y, p.z]));
    } else {
      const xs = landmarks.map(p => p.x);
      const ys = landmarks.map(p => p.y);
      const zs = landmarks.map(p => p.z);
      sendToMax("/facemesh/x", ...xs);
      sendToMax("/facemesh/y", ...ys);
      sendToMax("/facemesh/z", ...zs);
    }
  }

  frameCount++;
  const now = performance.now();
  if (now - lastTime > 1000) {
    const fps = (frameCount / ((now - lastTime) / 1000)).toFixed(1);
    if (check('sendOutput')) sendToMax("/facemesh/fps", parseFloat(fps));
    fpsDisplay.textContent = `FPS: ${fps}`;
    lastTime = now;
    frameCount = 0;
  }

}

function updateVideoVisibility() {
  // Keep the video active in Chromium/jweb while visually hiding it.
  videoElement.style.visibility = check('showVideo') ? 'visible' : 'hidden';
}

document.getElementById('showVideo').addEventListener(
  'change',
  updateVideoVisibility
);

updateVideoVisibility();

function drawOverlay(landmarks) {
  canvasCtx.fillStyle = 'green';
  for (const pt of landmarks) {
    const x = pt.x * canvasElement.width;
    const y = pt.y * canvasElement.height;
    const depthScale = 1 - pt.z * 5.0;
    const radius = Math.max(1, 0.0 + depthScale);
    canvasCtx.beginPath();
    canvasCtx.arc(x, y, radius, 0, 2 * Math.PI);
    canvasCtx.fill();
  }
}

window.addEventListener('pagehide', () => {
  ++cameraGeneration;
  stopActiveCamera();
});

initialiseCameras();
</script>

</body>
</html>
